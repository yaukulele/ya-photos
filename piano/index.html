<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>電鋼琴上架圖</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e3e3e6;--blue:#0071e3}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
nav .in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;padding:14px 12px;color:var(--ink);text-decoration:none;font-size:14px;opacity:.8}
nav a:hover{opacity:1}
header{max-width:1200px;margin:0 auto;padding:48px 16px 8px}
header h1{font-size:40px;letter-spacing:-.02em;margin:0 0 8px}
header p{color:var(--sub);margin:0 0 6px;font-size:16px;line-height:1.6}
.note{max-width:1200px;margin:16px auto 0;padding:0 16px}
.note div{background:var(--card);border-radius:18px;padding:18px 22px;font-size:14px;line-height:1.75;color:#333}
.note b{color:var(--ink)}
section.model{max-width:1200px;margin:0 auto;padding:56px 16px 8px;scroll-margin-top:50px}
.mh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.mh h2{font-size:34px;margin:0;letter-spacing:-.01em}.mh p{margin:4px 0 0;color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{appearance:none;border:0;border-radius:980px;padding:9px 18px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;text-align:center;font-family:inherit}
button.ghost{background:#e8e8ed;color:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
h3{font-size:19px;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h3 small{font-weight:400;color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.grid.scene{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.orig{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#f5f5f7;display:block;cursor:zoom-in}
.scene .card img{aspect-ratio:3/2;object-fit:cover}
.card .cap{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.card .cap span{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .cap a{color:var(--blue);text-decoration:none;flex:none;font-size:13px}
.sub{margin:18px 0 8px;color:var(--sub);font-size:14px}
.orig .card .cap{padding:7px 9px;font-size:12px}
details{margin-top:6px}
summary{cursor:pointer;color:var(--blue);font-size:15px;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
footer{max-width:1200px;margin:0 auto;padding:48px 16px 64px;color:var(--sub);font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
@media(max-width:600px){header h1{font-size:30px}.mh h2{font-size:28px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.grid.scene{grid-template-columns:1fr}.grid.orig{grid-template-columns:repeat(3,1fr);gap:8px}.card .cap{flex-direction:column;align-items:flex-start;gap:2px}.card .cap span{max-width:100%}}

.dl{display:inline-flex;align-items:center;justify-content:center;border-radius:980px;padding:9px 18px;font-size:14px;background:#1d1d1f;color:#fff;text-decoration:none}
.crumb{max-width:1200px;margin:0 auto;padding:18px 16px 0;font-size:14px}.crumb a{color:var(--blue);text-decoration:none}</style></head><body>
<nav><div class="in"><a href="../">← 全部</a><a href="FP-40/">FP-40</a></div></nav>

</div></section>
<footer>YA! 玩音樂 內部使用｜2026-11-18 整理</footer>
</body></html>
